<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHELAT STORE | تحميل تطبيقات وألعاب</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-container">
            <h1>📱 CHELAT STORE</h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن تطبيق...">
        </div>
    </header>

    <!-- Slider -->
    <section class="slider-section">
        <h2>🔥 الأكثر تميزاً</h2>
        <div class="slider-container" id="sliderContainer"></div>
    </section>

    <!-- Categories -->
    <section class="categories-section">
        <h2>📂 الفئات</h2>
        <div class="categories-container" id="categoriesContainer"></div>
    </section>

    <!-- Apps -->
    <section class="apps-section">
        <h2>📱 جميع التطبيقات</h2>
        <div class="apps-container" id="appsContainer"></div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 CHELAT STORE - جميع الحقوق محفوظة</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/apps-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
