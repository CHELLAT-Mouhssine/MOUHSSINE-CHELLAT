<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحضير الرابط... | CHELAT STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        .spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .countdown {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .download-btn {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s;
            display: inline-block;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
        }
        
        .download-btn.show {
            display: inline-block !important;
        }
        
        .ad-space {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .ad-text {
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f3f3f3;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>🔄 جاري تحضير رابط التحميل...</h1>
        <p>يرجى الانتظار قليلاً، سيتم توجيهك تلقائياً إلى صفحة التحميل</p>
        
        <div class="countdown" id="countdown">10</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <!-- مساحة للإعلانات - AdSense -->
        <div class="ad-space">
            <p class="ad-text">مساحة إعلانية - ضع كود AdSense هنا</p>
            <!-- حط كود AdSense هنا -->
            <!-- مثال:
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="XXXXXXXXXX"
                 data-ad-format="auto"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            -->
        </div>
        
        <a href="#" class="download-btn" id="downloadBtn">⬇️ تحميل الآن</a>
        
        <div class="footer">
            <p>© 2026 CHELAT STORE - جميع الحقوق محفوظة</p>
        </div>
    </div>

    <script>
        // جلب الرابط من URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const downloadUrl = urlParams.get('url');
        const appName = urlParams.get('app') || 'التطبيق';
        
        let countdown = 10;
        const countdownElement = document.getElementById('countdown');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressFill = document.getElementById('progressFill');
        
        // تحديث شريط التقدم
        function updateProgress() {
            const progress = ((10 - countdown) / 10) * 100;
            progressFill.style.width = progress + '%';
        }
        
        // عد عكسي
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            updateProgress();
            
            if (countdown <= 0) {
                clearInterval(timer);
                countdownElement.style.display = 'none';
                downloadBtn.classList.add('show');
                
                // تحويل تلقائي
                if (downloadUrl) {
                    setTimeout(() => {
                        window.location.href = downloadUrl;
                    }, 500);
                }
            }
        }, 1000);
        
        // زر التحميل اليدوي
        if (downloadBtn) {
            downloadBtn.href = downloadUrl || '#';
            downloadBtn.textContent = `تحميل ${appName}`;
        }
        
        // تسجيل حدث التحميل (لـ Analytics)
        window.addEventListener('load', () => {
            console.log('Waiting page loaded for:', appName);
            // يمكنك إضافة كود تتبع هنا
        });
    </script>
</body>
</html>
